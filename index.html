<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student System</title>
<style>
body{font-family:Arial;background:#f2f2f2;padding:20px;text-align:center}
h1{color:#222}
table{margin:20px auto;background:white;border-collapse:collapse;width:95%;max-width:700px}
th,td{border:1px solid #ddd;padding:12px}
th{background:#222;color:white}
.pass{color:green;font-weight:bold}
.fail{color:red;font-weight:bold}
</style>
</head>
<body>
<h1>🎓 نظام الطلاب - Student System</h1>
<table>
<thead>
<tr><th>ID</th><th>الاسم</th><th>الدرجات</th><th>المتوسط</th><th>التقدير</th><th>الحضور</th><th>النتيجة</th></tr>
</thead>
<tbody id="tbody"></tbody>
</table>
<script>
class Student {
  constructor(id, name, grades, attendance){
    this.id = id; this.name = name; this.grades = grades; this.attendance = attendance;
  }
  getAverage(){
    let sum = 0;
    for(let i=0; i<this.grades.length; i++){ sum = sum + this.grades[i]; }
    return sum / this.grades.length;
  }
  getGrade(avg){
    if(avg >= 90) return "A";
    if(avg >= 80) return "B";
    if(avg >= 70) return "C";
    if(avg >= 60) return "D";
    if(avg >= 50) return "E";
    return "F";
  }
  getResult(){
    let avg = this.getAverage();
    if(avg >= 50 && this.attendance >= 75) return "ناجح";
    return "يحتاج مراجعة";
  }
}
let studentsList = [
  new Student(1, "Ahmed", [80, 85, 90], 90),
  new Student(2, "Sara", [60, 65, 70], 85),
  new Student(3, "Omar", [42, 45, 47], 80),
  new Student(4, "Laila", [40, 48, 44], 60)
];
let tbody = document.getElementById("tbody");
studentsList.forEach((s) => {
  let avg = s.getAverage();
  let grade = s.getGrade(avg);
  let result = s.getResult();
  tbody.innerHTML += `<tr><td>${s.id}</td><td>${s.name}</td><td>${s.grades.join(" - ")}</td><td>${avg.toFixed(1)}</td><td>${grade}</td><td>${s.attendance}%</td><td class="${result === "ناجح" ? "pass" : "fail"}">${result}</td></tr>`;
});
</script>
</body>
</html>
